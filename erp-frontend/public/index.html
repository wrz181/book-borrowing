<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>类ERP平台（模拟第三方系统）</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 登录 / 单点登录落地页 -->
  <div id="login-view" class="hidden">
    <div class="login-box">
      <h1>类ERP平台</h1>
      <p class="sub">模拟第三方业务系统 · 运行于独立端口 <b id="self-port">5174</b></p>

      <div id="login-status" class="status-bar">正在校验单点登录票据…</div>

      <div class="manual-box">
        <p class="manual-tip">未自动登录？可从图书借阅管理系统左侧「集成应用」栏目点击进入，或在此粘贴单点登录票据手动登录：</p>
        <textarea id="ticket-input" rows="3" placeholder="粘贴单点登录票据（形如 xxxxx.yyyyyyyyyyyyyyyy）"></textarea>
        <button id="manual-login-btn" class="primary">票据登录</button>
      </div>
    </div>
  </div>

  <!-- 工作台 -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">类ERP平台</span>
        <span class="brand-sub">模拟第三方业务系统</span>
      </div>
      <div class="topbar-right">
        <span class="badge-app" id="app-name">-</span>
        <span class="user" id="user-name">-</span>
        <button id="logout-btn" class="ghost">退出</button>
      </div>
    </header>

    <main class="container">
      <div id="toast" class="toast hidden"></div>

      <!-- 待处理表单（由图书借阅管理系统下发） -->
      <section class="card">
        <div class="card-head">
          <h2>待处理表单</h2>
          <button id="refresh-btn" class="ghost small">刷新</button>
        </div>
        <p class="card-tip">以下表单由「图书借阅管理系统」下发（如图书采购单）。办理后系统会自动生成待办与消息提醒给发起人。</p>
        <div id="pending-list" class="list"></div>
      </section>

      <!-- 已处理表单 -->
      <section class="card">
        <div class="card-head">
          <h2>已处理表单</h2>
        </div>
        <div id="handled-list" class="list"></div>
      </section>

      <!-- 发起新表单（模拟第三方业务操作） -->
      <section class="card">
        <div class="card-head">
          <h2>发起新表单（模拟第三方业务）</h2>
        </div>
        <p class="card-tip">在类ERP平台完成一张表单，回传图书借阅管理系统后会生成一条待办与一条消息。</p>
        <form id="submit-form" class="form-grid">
          <label>表单标题
            <input type="text" id="f-title" value="图书采购申请" maxlength="200" required />
          </label>
          <label>表单类型
            <select id="f-type">
              <option value="BOOK_PURCHASE">图书采购</option>
              <option value="BORROW_APPLY">借阅申请</option>
            </select>
          </label>
          <label>采购数量
            <input type="number" id="f-quantity" value="10" min="1" max="9999" />
          </label>
          <label>处理意见
            <input type="text" id="f-comment" value="已审批通过，交采购部执行" maxlength="500" />
          </label>
          <button type="submit" class="primary">提交并回传</button>
        </form>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
